name: YouTube Compatibility Canary

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm i --no-save playwright-core
          npx playwright-core install --with-deps chromium

      - name: Run YouTube compatibility canary
        id: run_canary
        env:
          PLAYWRIGHT_CORE: playwright-core
        run: |
          set -o pipefail
          node scripts/canary.cjs 2>&1 | tee canary_output.txt

      - name: Report failure to GitHub Issues
        if: failure() && steps.run_canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="YouTube compatibility canary failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat << EOF > issue_body.md
          ### YouTube Compatibility Canary Failed

          The live YouTube contract check failed. This usually indicates an upstream change in YouTube's DOM or caption delivery pipeline.

          **Workflow Run:** [View Run Details]($RUN_URL)
          **Trigger:** \`${{ github.event_name }}\`
          **Ref:** \`${{ github.ref }}\`

          <details>
          <summary>Canary Output</summary>

          \`\`\`
          EOF

          if [ -f canary_output.txt ]; then
            cat canary_output.txt >> issue_body.md
          else
            echo "No output captured." >> issue_body.md
          fi

          cat << 'EOF' >> issue_body.md
          ```

          </details>
          EOF

          EXISTING_ISSUE=$(gh issue list --state open --limit 50 --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Found existing open issue #$EXISTING_ISSUE. Adding comment..."
            gh issue comment "$EXISTING_ISSUE" --body-file issue_body.md
          else
            echo "No existing open issue found. Creating new issue..."
            gh issue create --title "$ISSUE_TITLE" --body-file issue_body.md
          fi
